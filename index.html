<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="style.css">
  <title>VILA Galvão- Ponto</title>
</head>
<body>
  <header>
    <img src="/img/IMG-20260822-WA1502.jpg">
    <p>Registro de Ponto</p>
  </header>
  
<main>
  <section class="card">
    <h2>Identificação</h2>
    <input 
    type="text" 
    id="nome"
    placeholder="Motorista"
    >
    
    <input type="text" id="carro" placeholder="Carro">
    
    <input type="text" id="linha" placeholder="Linha">
    
     <input type="text" id="escala" placeholder="Escala">
  </section>
  
  <section class="card ponto">
    <h2>Registrar Ponto</h2>
    
    <div id="relogio">00:00:00</div>
    
    <p id="data"></p>
    
    <div class="botoes">
      
    <button onclick="registrar('entrada')" class="entrada">🟢Entrada</button>
    
      <button onclick="registrar('Início intervalo')" class="intervalo"> 🟡Início  intervalo</button>
      
       <button onclick="registrar('Fim intervalo')" class="intervalo"> 🔵Fim  intervalo</button>
      
      <button onclick="registrar('saida')" class="saida"> 🔴Saida</button>
      
    </div>
  </section>
  
  <section class=card>
    <h2>Histórico</h2>
    
    <div id="historico">
      Nenhum ponto registrado
    </div>
    
    <button onclick="limpar()" class="limpar">Limpar histórico</button>
  </section>
  
</main>

<footer>
  <p>© Vila Galvão 2026</p>
</footer>

<script src="script.js"></script>

</body>
</html>
